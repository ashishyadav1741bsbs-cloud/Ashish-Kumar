name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VER=$(echo "$JAVA_VER_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')
          if [ -z "$RAW_VER" ]; then
            echo "::error::Could not detect the active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          MAJOR_VER=$(echo "$RAW_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to create temporary debug keystore."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore does not exist after generation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac
          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Verified debug APK is missing or empty."
            exit 1
          fi
          REPO_SHORT="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO=$(echo "$REPO_SHORT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "$EXPECTED_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available. Skipping GitHub Release publishing."
            exit 1
          fi
          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release APK asset is missing or empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}

          Notice:
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore."

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest; then
            echo "::warning::GitHub Release creation failed for tag ${RELEASE_TAG}. The APK build and Actions artifact (app-debug-apk) remain available."
            exit 1
          fi

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success' && steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG" --json tagName,name,url,assets
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "GitHub Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **GitHub Release URL:** $RELEASE_URL"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release failed for tag \`$RELEASE_TAG\`, so no GitHub Release link was created."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` (downloadable from this workflow run's Artifacts section)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
